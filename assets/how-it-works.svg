<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Dictately works</title>
  <desc id="desc">Your microphone feeds local Whisper recognition, followed by phrase confirmation and cleanup, then text is typed into the selected field. Speech stays on your device.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17191e"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#24272e"/><stop offset="1" stop-color="#15171c"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#757c89"/><stop offset=".5" stop-color="#30343d"/><stop offset="1" stop-color="#4b515e"/></linearGradient>
    <linearGradient id="wave" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#9ca5b5"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#929baa"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#30343d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="36" y="43" fill="#f1f3f6" font-size="18" font-weight="600">From your voice to your text field</text>
    <text x="1164" y="42" fill="#a6adba" text-anchor="end" font-size="13">ON YOUR DEVICE</text>
    <g fill="url(#card)" stroke="url(#edge)">
      <rect x="36" y="74" width="246" height="155" rx="18"/>
      <rect x="330" y="74" width="246" height="155" rx="18"/>
      <rect x="624" y="74" width="246" height="155" rx="18"/>
      <rect x="918" y="74" width="246" height="155" rx="18"/>
    </g>
    <g stroke="#929baa" stroke-width="1.5" marker-end="url(#arrow)"><path d="M293 151H318"/><path d="M587 151H612"/><path d="M881 151H906"/></g>
    <g fill="none" stroke="#e3e7ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="149" y="98" width="20" height="33" rx="10"/>
      <path d="M141 121v3a18 18 0 0 0 36 0v-3m-18 22v10m-8 0h16"/>
      <rect x="435" y="105" width="36" height="36" rx="7"/>
      <path d="M443 97v8m10-8v8m10-8v8m-20 36v8m10-8v8m10-8v8m-36-36h8m-8 10h8m-8 10h8m36-20h8m-8 10h8m-8 10h8"/>
      <path d="M727 110h38m-38 12h28m-28 12h18m5 6 7 7 14-17"/>
      <rect x="1017" y="102" width="48" height="41" rx="6"/>
      <path d="M1025 115h19m-19 10h28m-2-18v17"/>
    </g>
    <g fill="#f2f4f8" font-size="17" font-weight="600" text-anchor="middle">
      <text x="159" y="181">Speak</text><text x="453" y="181">Recognize locally</text><text x="747" y="181">Confirm phrases</text><text x="1041" y="181">Type into your app</text>
    </g>
    <g fill="#aab2c0" font-size="13" text-anchor="middle">
      <text x="159" y="205">Your selected microphone</text><text x="453" y="205">Whisper · English / Indonesian</text><text x="747" y="205">Optional light cleanup</text><text x="1041" y="205">The field you selected</text>
    </g>
    <text x="600" y="270" text-anchor="middle" fill="#aab2c0" font-size="14">Local recognition. No cloud transcription. No account.</text>
  </g>
</svg>
