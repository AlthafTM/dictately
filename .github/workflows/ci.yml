name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements/bootstrap.txt
          python -m pip install -r requirements/dev.txt
      - name: Native unit tests
        run: cargo test --manifest-path native/Cargo.toml --release --locked
      - name: Shared, speech-worker and repository tests (no model downloads)
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Preference controls and microphone enumeration (no recording)
        shell: pwsh
        run: |
          cargo build --manifest-path native/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native/target/release/dictately.exe Dictately.exe
          python tests/check_preferences.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_picker_latency.py --messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare cloud speech fixtures and model
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m venv --system-site-packages .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python app/select_model.py small
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File ./tests/make_audio_fixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native dictation into an owned editor
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/check_native.py --quick
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native language picker, voice and shortcuts
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/check_language_picker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
