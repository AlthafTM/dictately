name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install -r requirements/base.txt
      - name: Native unit tests
        run: cargo test --manifest-path native/Cargo.toml --release --locked
      - name: Shared, speech-worker and repository tests (no model downloads)
        run: python -m unittest discover -s tests -p "test_*.py" -q
