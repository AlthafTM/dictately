name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create build environment
        run: python -m venv .venv
      - name: Build private runtimes and installer
        run: ./build-installer.ps1
      - name: Native checks
        run: cargo test --manifest-path native/Cargo.toml --release --locked
      - name: Python checks
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m unittest test_live_worker -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py' -q
      - uses: actions/upload-artifact@v4
        with:
          name: Transcribr-Windows-Installer
          path: |
            dist/Transcribr-*-Setup.exe
            dist/Transcribr-*-Setup.exe.sha256
          compression-level: 0
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Transcribr-*-Setup.exe
            dist/Transcribr-*-Setup.exe.sha256
