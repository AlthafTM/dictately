name: Windows installer
on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: 'Optional version tag for a draft release, for example v0.8.0'
        required: false
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional draft version
        if: inputs.draft_tag != ''
        shell: pwsh
        env:
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          $version = ((Get-Content native/Cargo.toml | Select-String '^version = "([^"]+)"').Matches[0].Groups[1].Value)
          if ($env:DRAFT_TAG -ne "v$version") { throw 'Draft tag must match the application version' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create build environment
        run: python -m venv .venv
      - name: Build private runtimes and installer
        run: ./build-installer.ps1
      - name: Native checks
        run: cargo test --manifest-path native/Cargo.toml --release --locked
      - name: Python checks
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m unittest test_live_worker -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py' -q
      - uses: actions/upload-artifact@v4
        with:
          name: Dictately-Windows-Installer
          path: |
            dist/Dictately-*-Setup.exe
            dist/Dictately-*-Setup.exe.sha256
          compression-level: 0
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.draft_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft_tag != '' }}
          generate_release_notes: true
          files: |
            dist/Dictately-*-Setup.exe
            dist/Dictately-*-Setup.exe.sha256
