name: macOS and Linux desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xdotool xclip xvfb openbox espeak libegl1 libopengl0 libxcb-util1 libxcb-shape0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Qt native dependencies
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from pathlib import Path
          import PySide6, subprocess
          library=Path(PySide6.__file__).parent/'Qt/plugins/platforms/libqxcb.so'
          result=subprocess.check_output(['ldd',str(library)],text=True)
          print(result)
          assert 'not found' not in result
          PY
      - name: Shared and desktop unit tests
        run: |
          python -m unittest test_live_worker -q
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Check launch scripts
        run: bash -n install-desktop.sh start-desktop.sh 'Install Transcribr.command' 'Start Transcribr.command'
      - name: Native desktop smoke test
        run: python tests/check_posix_desktop.py
      - name: Upload source launchers and guide
        uses: actions/upload-artifact@v4
        with:
          name: Transcribr-desktop-source-${{ matrix.os }}
          path: |
            *.py
            requirements.txt
            requirements-desktop.txt
            *Transcribr.command
            *desktop.sh
            assets/transcribr.png
            docs/MACOS-LINUX.md
      - name: Waveform preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveform-${{ matrix.os }}
          path: qa/desktop-waveform.png
          if-no-files-found: ignore
