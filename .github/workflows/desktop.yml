name: macOS and Linux desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xdotool xclip xvfb openbox espeak libegl1 libopengl0 libxcb-util1 libxcb-shape0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Install desktop dependencies
        run: |
          python -m pip install -r requirements/bootstrap.txt
          python -m pip install -r requirements/desktop.txt
      - name: Qt native dependencies
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from pathlib import Path
          import PySide6, subprocess
          library=Path(PySide6.__file__).parent/'Qt/plugins/platforms/libqxcb.so'
          result=subprocess.check_output(['ldd',str(library)],text=True)
          print(result)
          assert 'not found' not in result
          PY
      - name: Shared and desktop unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Check launch scripts
        run: bash -n scripts/desktop/install-desktop.sh scripts/desktop/start-desktop.sh 'launchers/macos/Install Dictately.command' 'launchers/macos/Start Dictately.command'
      - name: Native desktop and recognition checks
        run: python tests/check_posix_desktop.py
      - name: Upload source launchers and guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dictately-desktop-source-${{ matrix.os }}
          path: |
            app/
            requirements/
            launchers/macos/
            scripts/desktop/
            assets/dictately.png
            assets/dictately-tray.png
            docs/MACOS-LINUX.md
            LICENSE
            THIRD_PARTY.md
            licenses/
            README.md
      - name: Platform validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}
          path: |
            qa/platform-validation.json
            qa/linux-dictation.json
          if-no-files-found: ignore
      - name: Waveform preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waveform-${{ matrix.os }}
          path: qa/desktop-waveform.png
          if-no-files-found: ignore
